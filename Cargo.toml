[package]
name = "deepdelve"
version = "0.3.0"
edition = "2024"
description = "Underground voxel world tech demo: 3D chunks, enormous caverns, far render distance"
license = "MIT"
default-run = "deepdelve"

[dependencies]
wgpu = "30"
winit = "0.30"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
rustc-hash = "2"
log = "0.4"
env_logger = "0.11"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = "line-tables-only"
